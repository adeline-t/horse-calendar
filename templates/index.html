<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planning Cheval - Perfect for me</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐴</text></svg>">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Planning Cheval">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <h1>
            <span class="nav-title-full">🐴 Planning de Perfect for me</span>
            <span class="nav-title-short">🐴 Planning</span>
        </h1>
        <div class="nav-buttons">
            <a href="/stats.html" class="btn btn-nav">
                <span class="btn-icon">📊</span>
                <span class="btn-text">Statistiques</span>
            </a>
            <a href="/riders.html" class="btn btn-nav">
                <span class="btn-icon">👥</span>
                <span class="btn-text">Cavaliers</span>
            </a>
        </div>
    </nav>

    <!-- Container principal -->
    <div class="container">
        <div class="calendar-header">
            <button id="prevMonth" class="calendar-nav-btn" aria-label="Mois précédent">
                <span class="nav-arrow">←</span>
            </button>
            <h2 id="monthYear" class="calendar-title"></h2>
            <button id="nextMonth" class="calendar-nav-btn" aria-label="Mois suivant">
                <span class="nav-arrow">→</span>
            </button>
        </div>

        <!-- Calendrier desktop (grille) -->
        <div id="calendar" class="calendar desktop-only"></div>

        <!-- Liste mobile (2 colonnes) -->
        <div id="calendarList" class="calendar-list mobile-only"></div>

        <!-- Légende mobile -->
        <div class="calendar-legend">
            <p class="legend-hint">💡 Touchez un jour pour gérer le planning</p>
        </div>
    </div>

    <!-- Modal for managing one day's assignments -->
    <div id="modal" class="modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalDate">
            <button class="close" aria-label="Fermer">×</button>
            <header class="assignment-modal-header">
                <p class="modal-eyebrow">Planning du jour</p>
                <h3 id="modalDate" class="modal-title"></h3>
                <p id="assignmentSummary" class="assignment-summary"></p>
            </header>

            <section class="assignment-list-section" aria-labelledby="assignmentListTitle">
                <div class="section-heading-row">
                    <h4 id="assignmentListTitle">Activités</h4>
                    <span id="assignedCount" class="count-badge">0</span>
                </div>
                <div id="assignedRiders" class="assignment-list" aria-live="polite"></div>
            </section>

            <section class="assignment-composer" aria-labelledby="assignmentComposerTitle">
                <div class="composer-heading">
                    <span class="composer-icon" aria-hidden="true">＋</span>
                    <div>
                        <h4 id="assignmentComposerTitle">Nouvelle activité</h4>
                        <p>Choisissez un cavalier et un type de travail, puis ajoutez un commentaire si nécessaire.</p>
                    </div>
                </div>

                <div class="assignment-form-grid">
                    <fieldset class="assignment-field assignment-field-full">
                        <legend>Cavalier</legend>
                        <div id="assignmentRiderButtons" class="assignment-choice-grid" role="group" aria-label="Cavalier"></div>
                    </fieldset>

                    <fieldset class="assignment-field assignment-field-full">
                        <legend>Type de travail</legend>
                        <div id="assignmentWorkTypeButtons" class="assignment-choice-grid work-type-choice-grid" role="group" aria-label="Type de travail"></div>
                    </fieldset>

                    <label class="assignment-field assignment-field-full">
                        <span>Commentaire <small>(optionnel)</small></span>
                        <textarea id="assignmentComment" rows="3" maxlength="500" placeholder="Précisions sur la séance…"></textarea>
                    </label>
                </div>

                <div id="assignmentFormMessage" class="assignment-form-message" role="status"></div>
                <button id="addAssignmentBtn" class="btn btn-primary assignment-submit">
                    Ajouter l'activité
                </button>
            </section>
        </div>
    </div>

    <!-- Loading indicator -->
    <div id="loadingIndicator" class="loading-indicator" style="display: none;">
        <div class="spinner"></div>
        <p>Chargement...</p>
    </div>

    <!-- Toast notifications -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='workTypes.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
