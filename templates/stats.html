<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="stats-page">
    <nav class="stats-page-nav">
        <div>
            <p class="page-eyebrow">Planning</p>
            <h1>Statistiques</h1>
        </div>
        <a href="/" class="btn btn-secondary">← Retour au planning</a>
    </nav>

    <main class="container stats-dashboard">
        <section class="stats-toolbar" aria-labelledby="periodFilterTitle">
            <div>
                <p class="section-kicker">Période</p>
                <h2 id="periodFilterTitle">Filtrer les résultats</h2>
            </div>
            <div class="stats-filter-controls">
                <label>
                    <span>Mois</span>
                    <select id="monthFilter">
                        <option value="">Tous les mois</option>
                    </select>
                </label>
                <label>
                    <span>Année</span>
                    <select id="yearFilter">
                        <option value="">Toutes les années</option>
                    </select>
                </label>
                <button id="filterBtn" class="btn">Afficher</button>
                <button id="resetBtn" class="btn btn-secondary">Tout voir</button>
            </div>
        </section>

        <p id="statsPeriod" class="stats-period" aria-live="polite"></p>

        <div class="stats-grid">
            <section class="stats-panel">
                <div class="stats-panel-heading">
                    <span class="stats-panel-icon" aria-hidden="true">📅</span>
                    <div>
                        <h2>Jours planifiés par cavalier</h2>
                        <p>Un jour est compté une seule fois par cavalier.</p>
                    </div>
                </div>
                <div id="riderStats" class="stats-list"></div>
            </section>

            <section class="stats-panel">
                <div class="stats-panel-heading">
                    <span class="stats-panel-icon" aria-hidden="true">🏇</span>
                    <div>
                        <h2>Activités par type de travail</h2>
                        <p>Chaque activité enregistrée est comptabilisée.</p>
                    </div>
                </div>
                <div id="workTypeStats" class="stats-list"></div>
            </section>
        </div>
    </main>

    <script src="/static/workTypes.js"></script>
    <script src="{{ url_for('static', filename='stats.js') }}"></script>
</body>
</html>
